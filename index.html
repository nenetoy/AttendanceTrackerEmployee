<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Mobile Timesheet</title>
<style>

  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(180deg,#0b1220 0%,#111827 45%,#0f172a 100%);
    color:#e5e7eb;
    min-height:100vh;
  }
  .app{max-width:520px;margin:auto;padding:18px 14px 28px}
  .card{
    background:rgba(17,24,39,.92);
    border:1px solid rgba(148,163,184,.15);
    border-radius:22px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.28);
    backdrop-filter:blur(10px);
  }
  .hero{
    padding:20px 18px;
    background:linear-gradient(135deg,#0f172a 0%,#111827 60%,#1e293b 100%);
    border:1px solid rgba(56,189,248,.15);
  }
  .brandRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
    width:100%;
    min-width:0;
  }
  .brandWrap{
    display:flex;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
    min-width:0;
  }
  .logoBadge{
    width:94px;height:94px;border-radius:18px;
    display:flex;align-items:center;justify-content:center;
    background:transparent;
    box-shadow:none;
    flex:0 0 auto;
    overflow:visible;
    border:none;
  }
  .logoBadge img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    background:transparent;
  }
  .nameTag{
    font-size:14px;
    color:#f8fafc;
    font-weight:800;
    margin-top:4px;
  }
  .roleTag{
    font-size:14px;
    color:#93c5fd;
    margin-top:4px;
    font-weight:800;
    letter-spacing:.2px;
  }
  h1{font-size:19px;margin:0 0 2px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .sub{font-size:13px;color:#94a3b8}
  .userBlock{
    text-align:right;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:center;
    gap:1px;
    padding-top:0;
    flex:1 1 auto;
    min-width:0;
    overflow:hidden;
  }
  .heroName{
    font-size:clamp(30px,8vw,38px);
    line-height:1;
    color:#f8fafc;
    background:transparent;
    border:none;
    padding:0;
    border-radius:0;
    font-weight:900;
    letter-spacing:.2px;
    white-space:nowrap;
    max-width:100%;
  }
  .heroRole{
    font-size:clamp(14px,4.2vw,18px);
    line-height:1.1;
    color:#93c5fd;
    font-weight:900;
    padding:5px 0 0;
    letter-spacing:.2px;
    white-space:nowrap;
    max-width:100%;
  }
  .heroTag{
    font-size:11px;
    color:#93c5fd;
    background:rgba(59,130,246,.12);
    border:1px solid rgba(59,130,246,.25);
    padding:7px 10px;
    border-radius:999px;
    font-weight:700;
    white-space:nowrap;
  }
  .clock{
    text-align:center;
    font-size:44px;
    font-weight:900;
    margin:14px 0 4px;
    letter-spacing:1px;
    color:#f8fafc;
  }
  .date{text-align:center;color:#94a3b8;margin-bottom:18px;font-size:14px}
  .status{
    background:linear-gradient(180deg,rgba(30,41,59,.92),rgba(15,23,42,.92));
    border:1px solid rgba(100,116,139,.22);
    padding:14px;
    border-radius:16px;
    margin-bottom:14px;
    font-weight:700;
    color:#e2e8f0;
  }
  button{
    width:100%;
    border:none;
    border-radius:16px;
    padding:16px 14px;
    font-size:17px;
    font-weight:800;
    margin:7px 0;
    transition:.18s ease;
  }
  .in{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
  .out{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
  .export{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff}
  .secondary{
    background:#1f2937;
    color:#e5e7eb;
    font-size:15px;
    padding:13px;
    border:1px solid rgba(148,163,184,.15);
  }
  button:disabled{
    background:#334155!important;
    color:#94a3b8!important;
    opacity:.9;
    border:1px solid rgba(148,163,184,.1);
  }
  .record{
    padding:12px 0;
    border-bottom:1px solid rgba(148,163,184,.12);
  }
  .record:last-child{border-bottom:none}
  .d{font-weight:700;color:#f8fafc}
  .t{font-size:14px;color:#94a3b8;margin-top:4px;line-height:1.45}
  select{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid rgba(148,163,184,.18);
    font-size:16px;
    background:#0f172a;
    color:#e5e7eb;
  }
  .grid{display:grid;grid-template-columns:1fr;gap:8px}
  .note{font-size:12px;color:#94a3b8;margin-top:8px}
  .guide{
    font-size:13px;
    text-align:center;
    margin-top:8px;
    color:#93c5fd;
    font-weight:700
  }
  .secret-reset{
    display:none;
    background:#0f172a;
    color:#f8fafc;
    font-size:14px;
    padding:12px;
    margin-top:12px;
    position:relative;
    z-index:10;
    pointer-events:auto;
    border:1px solid rgba(148,163,184,.18);
  }
  .secret-reset.show{display:block}
  #previewCard{
    display:none;
    margin-top:14px;
    border-top:1px solid rgba(148,163,184,.12)!important;
    padding-top:14px;
  }
  #previewCard h3{margin:0 0 10px;color:#f8fafc}
  #previewTable{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    overflow:hidden;
    border-radius:12px;
  }
  #previewTable th{
    background:#0f172a;
    color:#cbd5e1;
    font-weight:800;
  }
  #previewTable th,#previewTable td{
    border:1px solid rgba(148,163,184,.16)!important;
    padding:8px;
    text-align:center;
  }
  #previewTable td{color:#e5e7eb;background:rgba(15,23,42,.7)}


  @media (max-width:420px){
    .logoBadge{width:78px;height:78px}
    .brandRow{gap:8px}
    .heroName{font-size:32px}
    .heroRole{font-size:15px}
  }
  @media (max-width:360px){
    .logoBadge{width:68px;height:68px}
    .heroName{font-size:29px}
    .heroRole{font-size:14px}
  }

  .summaryGrid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:12px;
  }
  .summaryBox{
    background:#0f172a;
    border:1px solid rgba(148,163,184,.14);
    border-radius:15px;
    padding:12px;
  }
  .summaryLabel{font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .summaryValue{font-size:22px;color:#f8fafc;font-weight:900;margin-top:3px}
  .alertBox{
    display:none;
    background:rgba(245,158,11,.10);
    border:1px solid rgba(245,158,11,.28);
    color:#fcd34d;
    padding:12px 13px;
    border-radius:14px;
    margin-bottom:14px;
    font-size:13px;
    line-height:1.4;
    font-weight:700;
  }
  .alertBox.show{display:block}
  .statusBadge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
    margin-bottom:10px;
  }
  .statusReady{background:rgba(59,130,246,.12);color:#93c5fd;border:1px solid rgba(59,130,246,.22)}
  .statusDuty{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.22)}
  .statusDone{background:rgba(148,163,184,.12);color:#cbd5e1;border:1px solid rgba(148,163,184,.18)}
  .noteInput{
    width:100%;
    resize:vertical;
    min-height:74px;
    background:#0f172a;
    color:#e5e7eb;
    border:1px solid rgba(148,163,184,.18);
    border-radius:13px;
    padding:12px;
    font:inherit;
    font-size:14px;
    margin-top:8px;
  }
  .miniBtn{
    padding:11px 12px;
    font-size:14px;
    border-radius:13px;
    margin-top:8px;
  }
  .adminPanel{
    display:none;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed rgba(148,163,184,.18);
  }
  .adminPanel.show{display:block}
  .adminInput{
    width:100%;
    background:#0f172a;
    color:#e5e7eb;
    border:1px solid rgba(148,163,184,.18);
    border-radius:12px;
    padding:11px;
    font-size:14px;
    margin:5px 0;
  }
  .adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .muted{font-size:12px;color:#94a3b8}


  .timeSection{
    background:rgba(15,23,42,.62);
    border:1px solid rgba(148,163,184,.13);
    border-radius:17px;
    padding:13px;
    margin-top:12px;
  }
  .sectionHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .sectionTitle{
    font-size:13px;
    font-weight:900;
    letter-spacing:.65px;
    color:#e2e8f0;
  }
  .sectionTotal{
    font-size:12px;
    font-weight:800;
    color:#93c5fd;
  }
  .travelIn{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff}
  .travelOut{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff}
  .dutyIn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
  .dutyOut{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}


  .profileEditBtn{
    margin-top:8px;
    padding:7px 10px;
    width:auto;
    font-size:11px;
    border-radius:999px;
    background:rgba(148,163,184,.10);
    color:#cbd5e1;
    border:1px solid rgba(148,163,184,.16);
  }
  .settingsOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(2,6,23,.78);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:18px;
  }
  .settingsOverlay.show{display:flex}
  .settingsBox{
    width:min(420px,100%);
    background:#111827;
    border:1px solid rgba(148,163,184,.16);
    border-radius:20px;
    padding:18px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .settingsTitle{font-size:20px;font-weight:900;color:#f8fafc;margin-bottom:12px}
  .settingsLabel{font-size:12px;color:#94a3b8;font-weight:700;margin:10px 0 5px}
  .settingsInput{
    width:100%;
    background:#0f172a;
    color:#f8fafc;
    border:1px solid rgba(148,163,184,.18);
    border-radius:12px;
    padding:12px;
    font-size:16px;
  }


  .creatorMark{
    position:fixed;
    right:10px;
    bottom:8px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.3px;
    color:rgba(255,255,255,.09);
    pointer-events:none;
    user-select:none;
    -webkit-user-select:none;
    z-index:998;
  }


.startupSplash{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:
    radial-gradient(circle at 50% 32%, rgba(37,99,235,.22), transparent 35%),
    linear-gradient(180deg,#08111f 0%,#0b1220 58%,#111827 100%);
  opacity:1; transition:opacity .4s ease;
}
.startupSplash.hide{opacity:0; pointer-events:none}
.splashInner{width:min(86vw,390px); text-align:center; transform:translateY(-2vh)}
.splashAppIcon{
  width:136px;height:136px;object-fit:cover;border-radius:31px;
  box-shadow:0 20px 60px rgba(0,0,0,.48),0 0 45px rgba(59,130,246,.16)
}
.splashTitle{margin-top:23px;font-size:31px;font-weight:900;color:#f8fafc;letter-spacing:-.5px}
.splashBy{margin-top:7px;font-size:17px;font-weight:800;color:#93c5fd}
.splashDivider{width:76px;height:3px;border-radius:999px;margin:21px auto;background:linear-gradient(90deg,#2563eb,#38bdf8)}
.splashPecWrap{
  width:190px;height:96px;margin:0 auto;display:flex;align-items:center;justify-content:center;
  border-radius:20px;background:rgba(255,255,255,.035);border:1px solid rgba(148,163,184,.1)
}
.splashPec{max-width:165px;max-height:80px;object-fit:contain}
.splashCompany{margin-top:9px;font-size:11px;color:#64748b;letter-spacing:.3px}

.firstProfileOverlay{
  display:none;position:fixed;inset:0;z-index:9000;
  background:rgba(2,6,23,.94);align-items:center;justify-content:center;padding:18px
}
.firstProfileOverlay.show{display:flex}
.firstProfileCard{
  width:min(430px,100%);border-radius:24px;padding:22px 18px 18px;
  background:linear-gradient(180deg,#111827,#0f172a);
  border:1px solid rgba(148,163,184,.16);box-shadow:0 24px 70px rgba(0,0,0,.48)
}
.firstProfileLogo{width:74px;height:74px;border-radius:18px;object-fit:cover;display:block;margin:0 auto 14px}
.firstProfileTitle{text-align:center;font-size:23px;color:#f8fafc;font-weight:900;margin-bottom:5px}
.firstProfileSub{text-align:center;color:#94a3b8;font-size:13px;line-height:1.45;margin-bottom:18px}
.requiredMark{color:#f87171}


/* ===== FINAL HEADER ORIENTATION ===== */

/* Header becomes vertical: top brand row, then profile directly below */
.brandRow{
  display:flex !important;
  flex-direction:column !important;
  align-items:stretch !important;
  justify-content:flex-start !important;
  gap:10px !important;
  margin-bottom:10px !important;
  width:100% !important;
}

/* First row: PEC logo + Attendance Tracker */
.brandWrap{
  width:100% !important;
  display:flex !important;
  align-items:center !important;
  justify-content:flex-start !important;
  gap:12px !important;
  min-width:0 !important;
}

.logoBadge{
  width:68px !important;
  height:68px !important;
  min-width:68px !important;
  flex:0 0 68px !important;
}

.brandWrap > div:last-child{
  flex:1 1 auto !important;
  min-width:0 !important;
}

/* Keep "Attendance Tracker" on ONE line */
.brandWrap h1{
  margin:0 !important;
  font-size:20px !important;
  line-height:1.15 !important;
  font-weight:900 !important;
  white-space:nowrap !important;
  overflow:visible !important;
  text-overflow:clip !important;
  text-align:left !important;
  letter-spacing:-.2px !important;
}

/* Existing profile sits immediately below the brand row */
.userBlock{
  width:100% !important;
  min-width:0 !important;
  display:grid !important;
  grid-template-columns:minmax(0,1fr) 40px !important;
  grid-template-rows:auto auto !important;
  column-gap:10px !important;
  row-gap:2px !important;
  align-items:center !important;
  text-align:left !important;
  padding:11px 12px !important;
  margin:0 !important;
  border-radius:15px !important;
  background:rgba(15,23,42,.72) !important;
  border:1px solid rgba(148,163,184,.14) !important;
  overflow:visible !important;
}

.heroName{
  grid-column:1 !important;
  grid-row:1 !important;
  font-size:17px !important;
  line-height:1.25 !important;
  font-weight:850 !important;
  color:#f8fafc !important;
  white-space:normal !important;
  overflow:visible !important;
  overflow-wrap:anywhere !important;
  word-break:break-word !important;
  max-width:100% !important;
  padding:0 !important;
  text-align:left !important;
}

.heroRole{
  grid-column:1 !important;
  grid-row:2 !important;
  font-size:12px !important;
  line-height:1.3 !important;
  font-weight:700 !important;
  color:#93c5fd !important;
  white-space:normal !important;
  overflow:visible !important;
  overflow-wrap:anywhere !important;
  word-break:break-word !important;
  max-width:100% !important;
  padding:0 !important;
  text-align:left !important;
}

/* Small edit icon only, same profile row */
.profileEditBtn{
  grid-column:2 !important;
  grid-row:1 / span 2 !important;
  align-self:center !important;
  justify-self:end !important;
  width:38px !important;
  height:38px !important;
  min-width:38px !important;
  padding:0 !important;
  margin:0 !important;
  border-radius:11px !important;
  font-size:0 !important;
  background:rgba(59,130,246,.10) !important;
  border:1px solid rgba(59,130,246,.18) !important;
  color:#93c5fd !important;
}

.profileEditBtn::before{
  content:"✎";
  font-size:19px;
  line-height:1;
}

.clock{
  margin-top:10px !important;
}

/* Small phones: title still stays on one line */
@media(max-width:380px){
  .logoBadge{
    width:58px !important;
    height:58px !important;
    min-width:58px !important;
    flex-basis:58px !important;
  }
  .brandWrap{
    gap:9px !important;
  }
  .brandWrap h1{
    font-size:17px !important;
  }
  .heroName{font-size:15px !important;}
  .heroRole{font-size:11.5px !important;}
}


/* ===== FONT SIZE ADJUSTMENT ===== */

/* Larger Attendance Tracker */
.brandWrap h1{
  font-size:24px !important;
  line-height:1.15 !important;
  font-weight:900 !important;
  letter-spacing:-0.3px !important;
}

/* Profile name and position: same font size */
.heroName{
  font-size:13px !important;
  line-height:1.35 !important;
  font-weight:800 !important;
}

.heroRole{
  font-size:13px !important;
  line-height:1.35 !important;
  font-weight:600 !important;
}

/* Keep title readable on narrow phones */
@media(max-width:380px){
  .brandWrap h1{
    font-size:21px !important;
  }
  .heroName,
  .heroRole{
    font-size:12.5px !important;
  }
}


.cloudSyncRow{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  margin-top:7px;
}
.cloudSyncPill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 9px;
  border-radius:999px;
  font-size:10.5px;
  font-weight:800;
  color:#fbbf24;
  background:rgba(245,158,11,.10);
  border:1px solid rgba(245,158,11,.18);
}
.cloudSyncPill.synced{
  color:#86efac;
  background:rgba(34,197,94,.10);
  border-color:rgba(34,197,94,.18);
}
.cloudSyncPill.offline{
  color:#cbd5e1;
  background:rgba(148,163,184,.08);
  border-color:rgba(148,163,184,.15);
}
.cloudSyncPill::before{
  content:"";
  width:7px;height:7px;border-radius:50%;
  background:currentColor;
}
.employeeIdLine{
  font-size:11px;
  line-height:1.3;
  color:#64748b;
  margin-top:2px;
  overflow-wrap:anywhere;
}


.userBlock{
  grid-template-rows:auto auto auto !important;
}
.employeeIdLine{
  grid-column:1 !important;
  grid-row:3 !important;
}
.profileEditBtn{
  grid-row:1 / span 3 !important;
}

</style>
</head>
<body>
